<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2d6e"/>
      <stop offset="50%" style="stop-color:#1B4FD8"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo icon -->
  <rect x="530" y="140" width="140" height="140" rx="32" fill="#1B4FD8" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="600" y="252" font-family="system-ui,-apple-system,sans-serif" font-size="120" font-weight="900"
        fill="#FBBF24" text-anchor="middle" letter-spacing="-4">t</text>
  <!-- Title -->
  <text x="600" y="365" font-family="system-ui,-apple-system,sans-serif" font-size="80" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-2">takaslat</text>
  <!-- Subtitle -->
  <text x="600" y="425" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="400"
        fill="rgba(255,255,255,0.75)" text-anchor="middle">Araç Takasının En Akıllı Adresi</text>
  <!-- Bottom decoration -->
  <rect x="480" y="500" width="240" height="4" rx="2" fill="#FBBF24" opacity="0.6"/>
</svg>
