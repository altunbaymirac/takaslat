services:
  postgres:
    image: postgres:16-alpine
    container_name: takaslat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: takaslat
      POSTGRES_PASSWORD: takaslat
      POSTGRES_DB: takaslat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaslat"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: takaslat_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
